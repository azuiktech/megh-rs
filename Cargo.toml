[workspace]
members = [
    ".",
    "megh-derive",
]

[package]
name = "megh"
version = "0.1.0"
edition = "2024"
description = "Micro Event-driven Gateway Hub in Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "4.2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
megh-derive = { path = "./megh-derive" }
oauth2 = { version = "5", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
reqwest-middleware = { version = "0.5", optional = true }
async-trait = { version = "0.1", optional = true }
aes-gcm = { version = "0.11", features = ["getrandom"], optional = true }
base64 = { version = "0.22", optional = true }
bcrypt = { version = "0.19", optional = true }
rusty-money = { version = "0.5", features = ["iso"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"], optional = true }
axum = { version = "0.8", optional = true }
html-escape = { version = "0.2", optional = true }
tracing = { version = "0.1", optional = true }
axum-extra = { version = "0.12", features = ["cookie", "query", "typed-header"], optional = true }
tower-http = { version = "0.7", features = ["csrf"], optional = true }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"], optional = true }
tower-sessions = { version = "0.14", optional = true }
axum-tower-sessions-csrf = { version = "=0.1.1", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
nutype = { version = "0.8.0", features = ["serde", "derive_unchecked", "rust_decimal"] }
email_address = "0.2.9"
celes = "3.0.0"
phonenumber = "0.3.10"
aip-160 = "0.1.5"
axum-params = { version = "0.4.1", optional = true }
paginator-utils = "0.4"
utoipa = { version = "6", features = ["uuid", "chrono"], optional = true }
utoipa-axum = { version = "0.3", optional = true }
serde_with = "3.24.0"
constcat = "0.6"
iso8601 = { version = "0.6", features = ["serde"] }
validator = { version = "0.21", features = ["derive"] }
rrule = { version = "0.14", features = ["serde"] }
itertools = "0.15.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
tower-sessions = { version = "0.14", features = ["memory-store"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
base64 = "0.22"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }

[features]
default = ["postgres", "client", "axum"]
postgres = ["dep:sqlx", "dep:bcrypt", "dep:aes-gcm", "dep:base64"]
client = ["dep:reqwest", "dep:reqwest-middleware", "dep:async-trait"]
axum = ["dep:axum", "dep:axum-params", "dep:utoipa", "dep:utoipa-axum", "dep:axum-extra", "dep:html-escape", "dep:tracing", "dep:tower-http", "dep:jsonwebtoken", "dep:tower-sessions", "dep:axum-tower-sessions-csrf", "dep:tokio", "dep:tokio-stream", "dep:futures-util"]
