[workspace]
members = [
    ".",
    "megh-derive",
]

[package]
name = "megh"
version = "0.1.0"
edition = "2024"
description = "Micro Event-driven Gateway Hub in Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
megh-derive = { path = "./megh-derive" }
oauth2 = { version = "5", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
reqwest-middleware = { version = "0.5" }
scraper = { version = "0.29" }
rmcp = { version = "3.6", default-features = false, features = ["client", "auth"] }
async-trait = { version = "0.1" }
aes-gcm = { version = "0.11", features = ["getrandom"] }
base64 = { version = "0.22" }
bcrypt = { version = "0.19" }
rusty-money = { version = "0.5", features = ["iso"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate"] }
axum = { version = "0.8" }
html-escape = { version = "0.2" }
tracing = { version = "0.1" }
axum-extra = { version = "0.12", features = ["cookie", "query", "typed-header"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["csrf", "limit"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
tower-sessions = { version = "0.14" }
tokio = { version = "1", features = ["sync", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
nutype = { version = "0.8.0", features = ["serde", "derive_unchecked", "rust_decimal"] }
email_address = "0.2.9"
celes = "3.0.0"
phonenumber = "0.3.10"
aip-160 = "0.1.5"
axum-params = { version = "0.4.1" }
paginator-utils = "0.4"
utoipa = { version = "6", features = ["uuid", "chrono", "preserve_order"] }
utoipa-axum = { version = "0.3" }
serde_with = "3.24.0"
constcat = "0.6"
iso8601 = { version = "0.6", features = ["serde"] }
validator = { version = "0.21", features = ["derive"] }
rrule = { version = "0.14", features = ["serde"] }
itertools = "0.15.0"

[dev-dependencies]
megh = { path = ".", features = ["sqlite"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
tower-sessions = { version = "0.14", features = ["memory-store"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
base64 = "0.22"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }

[features]
default = ["postgres"]
postgres = ["sqlx/postgres", "sqlx/rust_decimal"]
sqlite = ["sqlx/sqlite"]
