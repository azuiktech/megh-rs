[workspace]
members = [
    ".",
    "megh-derive",
]

[package]
name = "megh"
version = "0.1.0"
edition = "2024"
description = "Micro Event-driven Gateway Hub in Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "4.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
megh-derive = { path = "./megh-derive" }
oauth2 = { version = "5", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
reqwest-middleware = { version = "0.5", optional = true }
async-trait = { version = "0.1", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"], optional = true }
axum = { version = "0.8", optional = true }
tower-sessions = { version = "0.14", optional = true }
axum-tower-sessions-csrf = { version = "=0.1.1", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
tower-sessions = { version = "0.14", features = ["memory-store"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = ["postgres", "client", "axum"]
postgres = ["dep:sqlx"]
client = ["dep:reqwest", "dep:reqwest-middleware", "dep:async-trait"]
axum = ["dep:axum", "dep:tower-sessions", "dep:axum-tower-sessions-csrf", "dep:tokio", "dep:tokio-stream", "dep:futures-util"]
